- id: "gmail_oauth_reader_new_email_notification"
  alias: "Gmail - New Incoming Email Notification"
  description: "Dispatches a persistent notification whenever a new unread email is processed through the queue"
  trigger:
    - platform: state
      entity_id: sensor.gmail_latest_email
      not_to:
        - "idle"
        - "unknown"
        - "unavailable"
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
    - condition: template
      value_template: "{{ state_attr('sensor.gmail_latest_email', 'sender') is not none }}"
  action:
    - action: persistent_notification.create
      data:
        title: "Email from {{ state_attr('sensor.gmail_latest_email', 'sender') }}"
        message: >-
          **Subject:** {{ state_attr('sensor.gmail_latest_email', 'subject') }}

          {{ state_attr('sensor.gmail_latest_email', 'body_preview') }}
        notification_id: "gmail_{{ trigger.to_state.state }}"
  mode: queued
  max: 20

- id: "gmail_oauth_reader_event_notification"
  alias: "Gmail - New Incoming Email Event Notification"
  description: "Direct event-based trigger firing instantly on each incoming email"
  trigger:
    - platform: event
      event_type: gmail_oauth_reader_new_email
  action:
    - action: persistent_notification.create
      data:
        title: "Email from {{ trigger.event.data.sender }}"
        message: >-
          **Subject:** {{ trigger.event.data.subject }}

          {{ trigger.event.data.body_preview }}
        notification_id: "gmail_event_{{ trigger.event.data.message_id }}"
  mode: queued
  max: 20

- id: "gmail_oauth_reader_full_content_example"
  alias: "Gmail - Fetch Full Content On Demand"
  description: "Demonstrates fetching full plain-text, HTML body, and metadata via get_email_content action"
  trigger:
    - platform: event
      event_type: gmail_oauth_reader_new_email
  action:
    - action: gmail_oauth_reader.get_email_content
      data:
        message_id: "{{ trigger.event.data.message_id }}"
      response_variable: email_content
    - action: persistent_notification.create
      data:
        title: "Full Email from {{ email_content.sender }}"
        message: >-
          **Subject:** {{ email_content.subject }}
          **To:** {{ email_content.to }}
          **Date:** {{ email_content.date }}

          **Text Body:**
          {{ email_content.text_body }}
        notification_id: "gmail_full_{{ email_content.message_id }}"
  mode: queued
  max: 20

- id: "gmail_notify_from_aaronburt"
  alias: "Gmail - Persistent Notification from Aaron Burt"
  description: "Dispatches a persistent notification whenever an email is received from email@aaronburt.co.uk"
  trigger:
    - platform: event
      event_type: gmail_oauth_reader_new_email
  condition:
    - condition: template
      value_template: >-
        {{ trigger.event.data.sender_email | lower == 'email@aaronburt.co.uk' }}
  action:
    - action: persistent_notification.create
      data:
        title: "Email from {{ trigger.event.data.sender_name or trigger.event.data.sender_email }}"
        message: >-
          ### {{ trigger.event.data.subject }}

          {{ trigger.event.data.body_preview }}

          ---
          *Received at: {{ trigger.event.data.received_time }}*
        notification_id: "gmail_from_aaron_{{ trigger.event.data.message_id }}"
  mode: queued
  max: 20

- id: "gmail_oauth_reader_2fa_alert"
  alias: "Gmail - 2FA / OTP Verification Code Alert"
  description: "Dispatches a persistent notification with the verification code when an OTP email is received"
  trigger:
    - platform: event
      event_type: gmail_oauth_reader_new_email
  condition:
    - condition: template
      value_template: "{{ trigger.event.data.otp_code is defined and trigger.event.data.otp_code != None }}"
  action:
    - action: persistent_notification.create
      data:
        title: "2FA Code: {{ trigger.event.data.otp_code }}"
        message: >-
          ### Verification Code from {{ trigger.event.data.sender }}

          **Code:** `{{ trigger.event.data.otp_code }}`

          **Subject:** {{ trigger.event.data.subject }}

          *Do not share this code.*
        notification_id: "gmail_otp_{{ trigger.event.data.message_id }}"
  mode: queued
  max: 10


